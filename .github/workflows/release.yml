name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 2.0.0
        required: true
        type: string
      after-version:
        description: Snapshot version after release, such as 2.0.1-SNAPSHOT
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AFTER_VERSION: ${{ inputs.after-version }}
        run: |
          version_pattern='^[0-9A-Za-z][0-9A-Za-z._+-]*$'
          if [[ ! "$RELEASE_VERSION" =~ $version_pattern || "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo "Release version must be valid and must not end in -SNAPSHOT." >&2
            exit 1
          fi
          if [[ ! "$AFTER_VERSION" =~ $version_pattern || "$AFTER_VERSION" != *-SNAPSHOT ]]; then
            echo "After-version must be valid and end in -SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == "$AFTER_VERSION" ]]; then
            echo "Release and after-version must differ." >&2
            exit 1
          fi

  set-release-version:
    needs: validate
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  release:
    name: Build and publish release
    needs: set-release-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.set-release-version.outputs.commit-sha }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          toTag: ${{ needs.set-release-version.outputs.commit-sha }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/BlockhostOfficial/ViaVersionLimiter/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactoring", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build", "labels": ["build", "chore", "ci"] },
                { "title": "## Tests", "labels": ["test"] },
                { "title": "## Dependencies", "labels": ["dependencies"] },
                { "title": "## Other", "labels": [] }
              ],
              "empty_template": "No user-facing changes.",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\s\\S]+)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ needs.set-release-version.outputs.commit-sha }}
          name: ViaVersionLimiter ${{ inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: build/libs/ViaVersionLimiter-${{ inputs.version }}.jar
          fail_on_unmatched_files: true

  set-after-version:
    needs: release
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.after-version }}
    secrets: inherit
